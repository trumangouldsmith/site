<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initiative Tracker - Truman Gouldsmith</title>

  <link rel="apple-touch-icon" sizes="180x180" href="resources/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="resources/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="resources/favicon-16x16.png">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="content.css">
</head>
<body>

  <header class="site-header">
    <div class="logo-bubble">
      <a href="/"><img src="resources/lightbulb.png" alt="Home"></a>
    </div>
    <span class="site-title">trumangouldsmith.com</span>
  </header>

  <div class="page-wrapper">
    <nav class="sidebar">
      <a href="/posts" class="nav-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span class="nav-tooltip">Posts</span>
      </a>
      <a href="/tools" class="nav-btn active">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span class="nav-tooltip">Tools</span>
      </a>
      <a href="/interactives" class="nav-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="nav-tooltip">Interactives</span>
      </a>
    </nav>

    <main class="main-content">
      <h1>Initiative Tracker</h1>

      <p class="page-intro">Add each character with their initiative roll, hit <strong>Start Combat</strong>, and click a character's name to move them to the bottom of the order when their turn ends.</p>

      <div id="characterSetup">
        <form id="initForm" onsubmit="event.preventDefault(); addCharacter();">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" onkeypress="if(event.key==='Enter'){event.preventDefault();document.getElementById('initiative').focus();}">
          </div>
          <div class="form-group">
            <label for="initiative">Initiative</label>
            <input type="number" step="0.1" id="initiative" onkeypress="if(event.key==='Enter'){event.preventDefault();addCharacter();}">
          </div>
          <div class="btn-row">
            <button type="button" class="btn" onclick="addCharacter()">Add Character</button>
            <button type="button" class="btn" onclick="startCombat()">Start Combat</button>
            <button type="button" class="btn" onclick="resetTracker()">Reset</button>
          </div>
        </form>
        <ul id="characterList"></ul>
      </div>

      <div id="initiativeOrder" style="display:none;">
        <h2 style="margin-bottom:16px; color:#5D4037;">Combat Order</h2>
        <div id="turnQueue"></div>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn" onclick="undoLastMove()">Undo</button>
          <button class="btn" onclick="resetTracker()">Reset</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    let characters = [];
    let lastMove = null;

    function addCharacter() {
      const name = document.getElementById('name').value;
      const initiative = parseFloat(document.getElementById('initiative').value);
      if (!name || isNaN(initiative)) return;
      characters.push({ name, initiative });
      characters.sort((a, b) => b.initiative - a.initiative);
      renderCharacterList();
      document.getElementById('name').value = '';
      document.getElementById('initiative').value = '';
      document.getElementById('name').focus();
    }

    function renderCharacterList() {
      const list = document.getElementById('characterList');
      list.innerHTML = '';
      characters.forEach((char) => {
        const li = document.createElement('li');
        li.textContent = `${char.name} (Init: ${char.initiative})`;
        list.appendChild(li);
      });
    }

    function startCombat() {
      if (characters.length === 0) return;
      document.getElementById('characterSetup').style.display = 'none';
      document.getElementById('initiativeOrder').style.display = 'block';
      renderInitiativeQueue();
    }

    function renderInitiativeQueue() {
      const queue = document.getElementById('turnQueue');
      queue.innerHTML = '';
      characters.forEach((char, index) => {
        const card = document.createElement('div');
        card.className = 'tracker-card';
        card.textContent = char.name + ' (Init: ' + char.initiative + ')';
        card.onclick = () => {
          lastMove = { char: characters[index], from: index };
          const moved = characters.splice(index, 1)[0];
          characters.push(moved);
          renderInitiativeQueue();
        };
        queue.appendChild(card);
      });
    }

    function undoLastMove() {
      if (!lastMove) return;
      const index = characters.findIndex(c => c.name === lastMove.char.name && c.initiative === lastMove.char.initiative);
      if (index !== -1) {
        const [char] = characters.splice(index, 1);
        characters.splice(lastMove.from, 0, char);
        renderInitiativeQueue();
        lastMove = null;
      }
    }

    function resetTracker() {
      characters = [];
      lastMove = null;
      document.getElementById('characterList').innerHTML = '';
      document.getElementById('turnQueue').innerHTML = '';
      document.getElementById('characterSetup').style.display = 'block';
      document.getElementById('initiativeOrder').style.display = 'none';
      document.getElementById('name').value = '';
      document.getElementById('initiative').value = '';
      document.getElementById('name').focus();
    }
  </script>

  <script>
    document.querySelector('.logo-bubble').addEventListener('click', function() {
      this.classList.remove('clicked');
      void this.offsetWidth;
      this.classList.add('clicked');
      this.addEventListener('animationend', function handler() {
        this.classList.remove('clicked');
        this.removeEventListener('animationend', handler);
      });
    });
  </script>
</body>
</html>
