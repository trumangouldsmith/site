<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life - Truman Gouldsmith</title>

  <link rel="apple-touch-icon" sizes="180x180" href="resources/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="resources/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="resources/favicon-16x16.png">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="content.css">

  <style>
    :root {
      --cell-size: 20px;
      --cell-margin: 1px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo-bubble">
      <a href="/"><img src="resources/lightbulb.png" alt="Home"></a>
    </div>
    <span class="site-title">trumangouldsmith.com</span>
  </header>

  <div class="page-wrapper">
    <nav class="sidebar">
      <a href="/posts" class="nav-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span class="nav-tooltip">Posts</span>
      </a>
      <a href="/tools" class="nav-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span class="nav-tooltip">Tools</span>
      </a>
      <a href="/interactives" class="nav-btn active">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="nav-tooltip">Interactives</span>
      </a>
    </nav>

    <main class="main-content">
      <h1>Conway's Game of Life</h1>

      <div class="gol-controls">
        <button id="startBtn" class="btn">Start</button>
        <button id="stepBtn" class="btn">Step</button>
        <button id="clearBtn" class="btn">Clear</button>
        <label class="speed-control">
          <span class="speed-label">Speed (fps)</span>
          <input type="number" id="speedInput" min="1" max="60" value="5" class="speed-input">
        </label>
      </div>

      <div id="grid"></div>
    </main>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const startBtn = document.getElementById('startBtn');
    const stepBtn = document.getElementById('stepBtn');
    
    const clearBtn = document.getElementById('clearBtn');
    const speedInput = document.getElementById('speedInput');

    const cellSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-size'));
    const cellMargin = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-margin'));

    let rows, cols, totalCells;
    let cells = [];
    let currentState = [];
    let nextState = [];
    let running = false;
    let timerId = null;
    let fps = parseInt(speedInput.value);

    function calculateGridDimensions() {
      const gridWidth = grid.clientWidth;
      const gridHeight = grid.clientHeight;
      const cellTotalSize = cellSize + 2 * cellMargin;
      cols = Math.floor(gridWidth / cellTotalSize);
      rows = Math.floor(gridHeight / cellTotalSize);
      totalCells = rows * cols;
    }

    function createGrid() {
      grid.innerHTML = '';
      cells = new Array(totalCells);
      currentState = new Array(totalCells).fill(false);
      nextState = new Array(totalCells).fill(false);

      const cellTotal = cellSize + 2 * cellMargin;
      grid.style.gridTemplateColumns = `repeat(${cols}, ${cellTotal}px)`;
      grid.style.gridTemplateRows = `repeat(${rows}, ${cellTotal}px)`;
      grid.style.width = (cols * cellTotal) + 'px';
      grid.style.height = (rows * cellTotal) + 'px';

      const frag = document.createDocumentFragment();
      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = i;
        cell.addEventListener('click', () => {
          currentState[i] = !currentState[i];
          updateCellVisual(i);
        });
        frag.appendChild(cell);
        cells[i] = cell;
      }
      grid.appendChild(frag);
    }

    function updateCellVisual(i) {
      cells[i].classList.toggle('alive', currentState[i]);
    }

    function getIndex(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return -1;
      return r * cols + c;
    }

    function countAliveNeighbors(i) {
      const r = Math.floor(i / cols);
      const c = i % cols;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const ni = getIndex(r + dr, c + dc);
          if (ni !== -1 && currentState[ni]) count++;
        }
      }
      return count;
    }

    function step() {
      for (let i = 0; i < totalCells; i++) {
        const alive = currentState[i];
        const neighbors = countAliveNeighbors(i);
        nextState[i] = alive ? (neighbors === 2 || neighbors === 3) : (neighbors === 3);
      }
      [currentState, nextState] = [nextState, currentState];
      for (let i = 0; i < totalCells; i++) updateCellVisual(i);
    }

    function run() {
      step();
      if (running) {
        timerId = setTimeout(run, 1000 / fps);
      }
    }

    function stopRunning() {
      clearTimeout(timerId);
      timerId = null;
      running = false;
      startBtn.textContent = 'Start';
    }

    startBtn.addEventListener('click', () => {
      if (running) {
        stopRunning();
      } else {
        running = true;
        startBtn.textContent = 'Pause';
        run();
      }
    });

    stepBtn.addEventListener('click', () => {
      if (running) stopRunning();
      step();
    });

    clearBtn.addEventListener('click', () => {
      if (running) stopRunning();
      currentState.fill(false);
      for (let i = 0; i < totalCells; i++) updateCellVisual(i);
    });

    speedInput.addEventListener('change', () => {
      const val = parseInt(speedInput.value);
      if (!isNaN(val) && val >= 1 && val <= 60) fps = val;
      else speedInput.value = fps;
    });

    function init() {
      calculateGridDimensions();
      createGrid();
    }

    window.addEventListener('load', init);

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (running) stopRunning();
        init();
      }, 200);
    });
  </script>

  <script>
    document.querySelector('.logo-bubble').addEventListener('click', function() {
      this.classList.remove('clicked');
      void this.offsetWidth;
      this.classList.add('clicked');
      this.addEventListener('animationend', function handler() {
        this.classList.remove('clicked');
        this.removeEventListener('animationend', handler);
      });
    });
  </script>
</body>
</html>
